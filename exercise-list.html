<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SweatSheet — Exercise List</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script type="module" src="components.js"></script>
</head>
<body>

  <site-header></site-header>

  <main class="page">
    <div class="page-header">
      <h2>Exercise List</h2>
    </div>
    <div class="panel">
      <h3>Add Exercise</h3>
      <form id="exercise-form" class="form-grid">
        <input type="text" id="f-name" placeholder="Exercise name" required />
        <select id="f-category">
          <option value="">No category</option>
        </select>
        <button type="submit" class="btn btn-primary" id="add-exercise-btn">Add Exercise</button>
      </form>
      <div class="form-msg" id="form-msg" role="status" aria-live="polite"></div>
    </div>

    <div class="filters">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="search" placeholder="Search exercises…" />
      </div>
      <select id="category-filter">
        <option value="">All Categories</option>
      </select>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
          </tr>
        </thead>
        <tbody id="exercise-tbody">
          <tr class="state-row">
            <td colspan="2">
              <div class="spinner"></div>
              Loading exercises…
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <site-nav active="exercise-list"></site-nav>

  <script type="module">
    import { getCategories, getExercises, addExercise } from './db.js'

    const tbody          = document.getElementById('exercise-tbody')
    const searchInput    = document.getElementById('search')
    const categoryFilter = document.getElementById('category-filter')
    const addForm        = document.getElementById('exercise-form')
    const nameInput      = document.getElementById('f-name')
    const categoryInput  = document.getElementById('f-category')
    const addButton      = document.getElementById('add-exercise-btn')
    const formMsg        = document.getElementById('form-msg')

    let allExercises = []

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ))
    }

    function errorMessage(err, fallback) {
      return err && err.message ? err.message : fallback
    }

    function renderTable(exercises) {
      if (!exercises.length) {
        tbody.innerHTML = `
          <tr class="state-row">
            <td colspan="2">
              No exercises found.
            </td>
          </tr>`
        return
      }

      tbody.innerHTML = exercises.map(ex => {
        const name = escapeHtml(ex.name)
        const cat  = ex.sweatsheet_categories?.name

        return `
          <tr>
            <td data-label="Name"><span class="exercise-name">${name}</span></td>
            <td data-label="Category">${cat ? `<span class="badge">${escapeHtml(cat)}</span>` : '—'}</td>
          </tr>`
      }).join('')
    }

    function applyFilters() {
      const search = searchInput.value.toLowerCase()
      const catId  = categoryFilter.value
      renderTable(allExercises.filter(ex => {
        const matchesSearch   = ex.name.toLowerCase().includes(search)
        const matchesCategory = !catId || String(ex.category_id) === catId
        return matchesSearch && matchesCategory
      }))
    }

    function setFormMessage(message, isError = false) {
      formMsg.textContent = message
      formMsg.className = isError ? 'form-msg err' : 'form-msg'
    }

    function populateCategories(categories) {
      for (const cat of categories) {
        const filterOpt = document.createElement('option')
        filterOpt.value = cat.id
        filterOpt.textContent = cat.name
        categoryFilter.appendChild(filterOpt)

        const formOpt = document.createElement('option')
        formOpt.value = cat.id
        formOpt.textContent = cat.name
        categoryInput.appendChild(formOpt)
      }
    }

    function sortExercises() {
      allExercises.sort((a, b) => a.name.localeCompare(b.name, undefined, { sensitivity: 'base' }))
    }

    async function handleAddExercise(e) {
      e.preventDefault()
      if (!nameInput.value.trim()) {
        nameInput.focus()
        setFormMessage('Add an exercise name first.', true)
        return
      }

      addButton.disabled = true
      setFormMessage('Saving...')
      try {
        const exercise = await addExercise({
          name: nameInput.value,
          categoryId: categoryInput.value,
        })
        allExercises.push(exercise)
        sortExercises()
        applyFilters()
        addForm.reset()
        setFormMessage(`Added ${exercise.name}.`)
        nameInput.focus()
      } catch (err) {
        console.error(err)
        setFormMessage(err && err.message ? `Couldn't add exercise - ${err.message}` : "Couldn't add exercise.", true)
      } finally {
        addButton.disabled = false
      }
    }

    async function init() {
      try {
        const [categories, exercises] = await Promise.all([getCategories(), getExercises()])

        populateCategories(categories)

        allExercises = exercises
        renderTable(allExercises)
      } catch (err) {
        console.error(err)
        tbody.innerHTML = `<tr class="state-row"><td colspan="2">${escapeHtml(errorMessage(err, "Couldn't load exercises."))}</td></tr>`
      }
    }

    searchInput.addEventListener('input', applyFilters)
    categoryFilter.addEventListener('change', applyFilters)
    addForm.addEventListener('submit', handleAddExercise)
    init()
  </script>

</body>
</html>
