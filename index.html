<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SweatSheet</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script type="module" src="components.js"></script>
</head>
<body>

  <site-header></site-header>

  <section class="hero">
    <h1>Built for <span>every rep.</span></h1>
    <p>Log your workouts, track your progress, and see your gains — all in one place.</p>
    <a class="cta" href="exercise-list.html">Let's Go!</a>
  </section>

  <site-nav active="home"></site-nav>

  <script>
    const cta = document.querySelector('.cta')
    if (location.search && cta) {
      const url = new URL(cta.getAttribute('href'), location.href)
      const params = new URLSearchParams(location.search)
      for (const name of ['day', 'set', 'user', 'cardio']) params.delete(name)
      for (const [name, value] of params) {
        url.searchParams.set(name, value)
      }
      cta.href = url.pathname.split('/').pop() + url.search + url.hash
    }
  </script>
</body>
</html>
